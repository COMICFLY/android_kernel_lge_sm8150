name: Build LG G8 kernel (SukiSU / KSU latest)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核源码仓库（upstream）"
        default: "Xtrakari/android_kernel_lge_sm8150"
        required: true
      kernel_branch:
        description: "内核分支"
        default: "8150-susfs"
        required: true
      defconfig:
        description: "defconfig 文件名（相对 configs/vendor/）"
        default: "lgg8_defconfig"
        required: true
      base_config:
        description: "基线配置路径（留空则用源码自带 defconfig）"
        default: "configs/lgg8-running.config"
        required: false
      ksu_repo:
        description: "root 实现仓库"
        default: "https://github.com/Justadeayo/KernelSU"
        required: true
      ksu_ref:
        description: "ref（该 fork 默认 master）"
        default: "master"
        required: true
      enable_root:
        description: "是否集成 root（false=纯内核，用于隔离测试）"
        default: "true"
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo }}
          ref: ${{ github.event.inputs.kernel_branch }}
          fetch-depth: 1
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl file flex git \
            libncurses5-dev libssl-dev make zip wget \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Fetch Neutron Clang toolchain
        run: |
          mkdir -p "$HOME/tc/neutron-clang"
          cd "$HOME/tc/neutron-clang"
          curl -sLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest
          ./antman --patch=glibc
          echo "$HOME/tc/neutron-clang/bin" >> "$GITHUB_PATH"
          echo "=== 工具链自检 ==="
          ls "$HOME/tc/neutron-clang/bin" | head -10
          which clang && clang --version | head -1
          which aarch64-linux-gnu-ld && aarch64-linux-gnu-ld --version | head -1

      - name: Use known-good base config
        run: |
          DEF="kernel/arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}"
          SRC="${{ github.event.inputs.base_config }}"
          if [ -z "$SRC" ]; then
            echo "未提供基线配置，使用源码自带 defconfig"; exit 0
          fi
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEF"
          else
            URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${SRC}"
            echo "从 $URL 下载基线配置"
            curl -fsSL "$URL" -o "$DEF" || { echo "基线配置下载失败"; exit 1; }
          fi
          echo "行数: $(wc -l < "$DEF")"
          grep -c "^CONFIG_" "$DEF"
          grep -E "^CONFIG_(KSU|SUSFS)" "$DEF" | head -6

      - name: Integrate root solution (latest)
        if: ${{ github.event.inputs.enable_root != 'false' }}
        run: |
          git clone --branch "${{ github.event.inputs.ksu_ref }}" \
            ${{ github.event.inputs.ksu_repo }} kernel/KernelSU
          echo "root commit: $(cd kernel/KernelSU && git rev-parse --short HEAD)"
          rm -rf kernel/drivers/kernelsu
          ln -sfn ../KernelSU/kernel kernel/drivers/kernelsu
          ls -l kernel/drivers/kernelsu
          ls kernel/drivers/kernelsu/uapi 2>/dev/null | head -3 || \
            ln -sfn ../uapi kernel/KernelSU/kernel/uapi
          grep -q "kernelsu" kernel/drivers/Makefile || \
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel/drivers/Makefile
          grep -q "drivers/kernelsu" kernel/drivers/Kconfig || \
            printf '\nsource "drivers/kernelsu/Kconfig"\n' >> kernel/drivers/Kconfig

      - name: Enable KSU / SUSFS / KPROBES in defconfig
        if: ${{ github.event.inputs.enable_root != 'false' }}
        run: |
          DEF="kernel/arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}"
          test -f "$DEF" || { echo "defconfig 不存在: $DEF"; exit 1; }
          for c in \
            CONFIG_KSU=y \
            CONFIG_KSU_SUSFS=y \
            CONFIG_KSU_SUSFS_SUS_MOUNT=y \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \
            CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \
            CONFIG_KSU_SUSFS_SUS_PATH=y \
            CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
            CONFIG_KSU_SUSFS_ENABLE_LOG=y \
            CONFIG_KPROBES=y \
            CONFIG_KPROBE_EVENTS=y \
            CONFIG_HAVE_KPROBES=y \
            CONFIG_EXT4_FS=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y ; do
            grep -q "^$c$" "$DEF" || echo "$c" >> "$DEF"
          done
          echo "=== defconfig 末尾 ==="
          tail -16 "$DEF"

      - name: Patch known source quirks
        run: |
          cd kernel
          test -f kernel/cgroup/cpuset.c || { echo "cpuset.c 路径不对"; ls; exit 1; }
          python3 - <<'PY'
          import io
          p = 'kernel/cgroup/cpuset.c'
          s = io.open(p, encoding='utf-8', errors='surrogateescape').read()
          marker_fn = 'static ssize_t cpuset_write_resmask_assist('
          marker_next = 'static ssize_t cpuset_write_resmask_wrapper('
          if '#ifdef CONFIG_CPUSET_ASSIST\n' + marker_fn in s:
              print('already guarded, skip')
          elif marker_fn in s and marker_next in s:
              i = s.index(marker_fn)
              j = s.index(marker_next, i)
              s = s[:i] + '#ifdef CONFIG_CPUSET_ASSIST\n' + s[i:j] + '#endif\n\n' + s[j:]
              io.open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print('patched: cpuset_write_resmask_assist guarded')
          else:
              print('pattern not found, nothing to patch')
          PY
          echo "--- 补丁后确认 ---"
          grep -n -B1 "cpuset_write_resmask_assist" kernel/cgroup/cpuset.c | head -6
          python3 - <<'PY'
          import io, os
          p = 'drivers/kernelsu/sulog/event.c'
          if not os.path.exists(p):
              print('sulog/event.c 不存在，跳过'); raise SystemExit(0)
          s = io.open(p, encoding='utf-8', errors='surrogateescape').read()
          old = '    struct timespec64 ts;'
          new = ('#if KERNEL_VERSION(4, 19, 0) <= LINUX_VERSION_CODE\n'
                 '    struct timespec64 ts;\n'
                 '#else\n'
                 '    struct timespec ts;\n'
                 '#endif')
          if 'struct timespec ts;' in s and '#else\n    struct timespec ts;' in s:
              print('sulog 已适配，跳过')
          else:
              n = s.count(old)
              s = s.replace(old, new)
              io.open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
              print(f'sulog 补丁完成，替换 {n} 处')
          PY
          grep -n -A3 "struct timespec64 ts" drivers/kernelsu/sulog/event.c 2>/dev/null | head -8
          python3 - <<'PY'
          import io
          p = 'kernel/sched/tune.c'
          s = io.open(p, encoding='utf-8', errors='surrogateescape').read()
          a = '\t\t.write_s64 = boost_write_wrapper,'
          b = '\t\t.write_u64 = prefer_idle_write_wrapper,'
          a2 = ('#ifdef CONFIG_STUNE_ASSIST\n\t\t.write_s64 = boost_write_wrapper,\n'
                '#else\n\t\t.write_s64 = boost_write,\n#endif')
          b2 = ('#ifdef CONFIG_STUNE_ASSIST\n\t\t.write_u64 = prefer_idle_write_wrapper,\n'
                '#else\n\t\t.write_u64 = prefer_idle_write,\n#endif')
          changed = 0
          if a in s:
              s = s.replace(a, a2); changed += 1
          if b in s:
              s = s.replace(b, b2); changed += 1
          if changed:
              io.open(p, 'w', encoding='utf-8', errors='surrogateescape').write(s)
          print(f'tune.c 补丁: {changed} 处')
          PY
          grep -n -B1 -A5 "write_s64 = boost_write" kernel/sched/tune.c | head -10

      - name: Build kernel (Image)
        run: |
          set -o pipefail
          cd kernel
          echo "=== 工具链自检 ==="
          which clang aarch64-linux-gnu-ld arm-linux-gnueabi-as
          clang --version | head -1

          echo "=== 生成 .config ==="
          make O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/${{ github.event.inputs.defconfig }} > defconfig.log 2>&1 \
            || { echo "defconfig 失败"; tail -40 defconfig.log; exit 1; }
          echo "defconfig OK"

          echo "=== 编译（全量日志写入 build.log，不刷屏）==="
          if make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-default-const-init-var-unsafe" \
            Image > build.log 2>&1 ; then
            echo "=== 编译成功 ==="
            tail -5 build.log
          else
            echo "=== 编译失败：错误行摘要 ==="
            grep -n -iE "error:|fatal error|Error [0-9]+|No such file" build.log | tail -40 || true
            echo "=== 日志末尾 100 行 ==="
            tail -100 build.log
            exit 1
          fi

          echo "=== 产物 ==="
          ls -lh out/arch/arm64/boot/
          test -s out/arch/arm64/boot/Image || { echo "Image 未生成！"; exit 1; }

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            kernel/build.log
            kernel/defconfig.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Xtrakari/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          ROOT_SHA=$(cd kernel/KernelSU && git rev-parse --short HEAD)
          ZIP="AK3-LG-G8-ksu-${ROOT_SHA}-$(date +%Y%m%d%H%M).zip"
          (cd ak3 && zip -r9 "../$ZIP" .)
          ls -lh "$ZIP"
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sukisu-${{ github.run_number }}
          name: SukiSU kernel build ${{ github.run_number }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
